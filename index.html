<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flexbox Centering</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <!-- Nội dung bên trong container -->
      <div class="content">
        <h1>FlexBox</h1>
        <p>Đây là nội dung được căn giữa theo cả chiều dọc và chiều ngang.</p>
      </div>
    </div>

    <!-- Section lưới (Grid) 3 cột -->
    <section class="grid-section">
      <div class="grid-card">
        <h3>Nôi dung 1</h3>
        <p>Nội dung thẻ thứ nhất.</p>
      </div>
      <div class="grid-card">
        <h3>Nôi dung 2</h3>
        <p>Nội dung thẻ thứ hai.</p>
      </div>
      <div class="grid-card">
        <h3>Nôi dung 3</h3>
        <p>Nội dung thẻ thứ ba.</p>
      </div>
    </section>
  </body>
</html>
